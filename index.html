<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚫 HTML Style Omitter</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      color: #bb86fc;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .app-description {
      text-align: center;
      color: #b0b0b0;
      margin-bottom: 30px;
    }
    
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
    }
    
    .editor-box {
      background-color: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #252525;
      border-bottom: 1px solid #333;
    }
    
    .editor-title {
      font-weight: 600;
      color: #bb86fc;
    }
    
    .editor-controls {
      display: flex;
      gap: 10px;
    }
    
    .copy-btn {
      background-color: #3700b3;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    
    .copy-btn:hover {
      background-color: #6200ee;
    }
    
    textarea {
      width: 100%;
      height: 400px;
      padding: 15px;
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: none;
      resize: vertical;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      flex-grow: 1;
    }
    
    textarea:focus {
      outline: 1px solid #bb86fc;
    }
    
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #03dac6;
      color: #000;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 1000;
    }
    
    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    footer {
      margin-top: 30px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HTML Style Omitter</h1>
    <p class="app-description">
      Paste your HTML code (including HTML, CSS, and JS) in the left editor.<br>
      The right editor will automatically show the same code with styles removed.
    </p>
    
    <div class="editor-container">
      <div class="editor-box">
        <div class="editor-header">
          <div class="editor-title">Input HTML</div>
          <div class="editor-controls">
            <button class="copy-btn" onclick="clearInput()">Clear</button>
          </div>
        </div>
        <textarea id="input-editor" placeholder="Paste your HTML code here..."></textarea>
      </div>
      
      <div class="editor-box">
        <div class="editor-header">
          <div class="editor-title">Output HTML</div>
          <div class="editor-controls">
            <button class="copy-btn" onclick="copyOutput()">Copy</button>
          </div>
        </div>
        <textarea id="output-editor" placeholder="Output will appear here..." readonly></textarea>
      </div>
    </div>
  </div>
  
  <div class="notification" id="notification">Copied to clipboard!</div>
  
  <footer>
    Made by Kay 🧡
  </footer>

  <script>
    const inputEditor = document.getElementById('input-editor');
    const outputEditor = document.getElementById('output-editor');
    const notification = document.getElementById('notification');
    
    // Process input HTML whenever it changes
    inputEditor.addEventListener('input', processHtml);
    
    function processHtml() {
      const inputHtml = inputEditor.value;
      
      if (!inputHtml) {
        outputEditor.value = '';
        return;
      }
      
      // Replace style tags content with the placeholder
      const processedHtml = inputHtml.replace(
        /(<style[^>]*>)([\s\S]*?)(<\/style>)/gi, 
        '$1(styling omitted for brevity. Do not write any styling)$3'
      );
      
      outputEditor.value = processedHtml;
    }
    
    function copyOutput() {
      if (!outputEditor.value) return;
      
      outputEditor.select();
      document.execCommand('copy');
      
      // Show notification
      notification.classList.add('show');
      setTimeout(() => {
        notification.classList.remove('show');
      }, 2000);
    }
    
    function clearInput() {
      inputEditor.value = '';
      outputEditor.value = '';
    }
  </script>
</body>
</html>
